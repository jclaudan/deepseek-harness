services:
  dsh:
    build: .
    container_name: deepseek-dsh
    ports:
      - "3080:3080"
      - "3443:3443"
    environment:
      # Renseignez vos IPs LAN (ex: "192.168.1.10:3080 192.168.1.11:3080")
      # Vide = seul localhost accepté par dsh web (rejet Host header du LAN)
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-}"
      # LLM JanAI OpenAI-compatible (bootstrap-only: doit être dans l'environnement de lancement, pas dans .env)
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # Web search provider (searxg) — bootstrap-only, must be set here not in .env
      DSH_WEB_SEARCH_PROVIDER: "searxg"
      SEARXG_BASE_URL: "${SEARXG_BASE_URL:-http://searxng:8080}"
    restart: unless-stopped
    shm_size: '512M'
    volumes:
      - dsh-home:/root/.dsh
      - dsh-data:/usr/src/app/data

  searxng:
    image: searxng/searxng:latest
    container_name: deepseek-searxng
    ports:
      - "8080:8080"
    restart: unless-stopped
    shm_size: '256m'
    volumes:
      - ./searxng-settings.yml:/usr/local/searxng/searx/settings.yml

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    container_name: deepseek-playwright
    depends_on: [dsh]
    environment:
      PLAYWRIGHT_BASE_URL: http://dsh:3080
    volumes:
      - ./:/work
      - /work/node_modules
    working_dir: /work
    entrypoint: ["npx", "playwright", "test", "--reporter=list"]
    profiles: ["playwright"]

volumes:
  dsh-home:
  dsh-data:
